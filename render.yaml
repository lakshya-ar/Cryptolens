services:
  # --- 1. Unified FastAPI REST API + WebSocket Server (Python) -------------
  - type: web
    name: cryptolens-backend
    runtime: python
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: CORS_ORIGINS
        value: "*"
      # sync: false pauses the blueprint to prompt you for the DB string in the UI
      - key: DATABASE_URL
        sync: false

  # --- 2. React Frontend (Static Site) -------------------------------------
  - type: web
    name: cryptolens-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE
        fromService:
          type: web
          name: cryptolens-backend
          property: host
      - key: VITE_WS_URL
        fromService:
          type: web
          name: cryptolens-backend
          property: host