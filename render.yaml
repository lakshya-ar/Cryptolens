# Render Blueprint — deploys the whole CryptoLens stack on Render's free tier.
#   1. cryptolens-db        : managed PostgreSQL (free)
#   2. cryptolens-backend   : FastAPI REST API + /ws WebSocket (free web service)
#   3. cryptolens-frontend  : React + Vite static site (always free)
#
# Render Dashboard → New → Blueprint → connect this repo → Apply. Everything
# below is provisioned and wired automatically; no manual env vars required.

databases:
  # --- Managed PostgreSQL (free plan) --------------------------------------
  - name: cryptolens-db
    databaseName: cryptolens
    plan: free
    region: singapore

services:
  # --- 1. FastAPI REST API + WebSocket relay (Python) ----------------------
  - type: web
    name: cryptolens-backend
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    # Ingestion runs at startup, NOT build: Render's build phase can't reach the
    # private Postgres. bootstrap ingests a starter dataset (Jan–Mar 2024, all 5
    # assets) only if the DB is empty, in the background, so uvicorn binds the
    # port immediately and the health check passes while data loads. Tune the
    # window with the INGEST_START / INGEST_END env vars below.
    startCommand: "python -m ingestion.bootstrap & uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: CORS_ORIGINS
        value: "*"
      # Starter-dataset window loaded at first startup (YYYY-MM). Widen for more
      # history (longer first boot, more storage). Idempotent on later boots.
      - key: INGEST_START
        value: "2024-01"
      - key: INGEST_END
        value: "2024-03"
      - key: DATABASE_URL
        fromDatabase:
          name: cryptolens-db
          property: connectionString

  # --- 2. React Frontend (Static Site — always free) -----------------------
  - type: web
    name: cryptolens-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    # SPA fallback so deep links / refreshes resolve to index.html.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "20"
      # api.js turns a bare host into https://<host>/api and wss://<host>/ws,
      # so the backend's `host` property is exactly what both vars need.
      - key: VITE_API_BASE
        fromService:
          type: web
          name: cryptolens-backend
          property: host
      - key: VITE_WS_URL
        fromService:
          type: web
          name: cryptolens-backend
          property: host
