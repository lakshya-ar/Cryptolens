services:
  # --- 1. FastAPI REST API (Python) -------------------------
  - type: web
    name: cryptolens-api
    runtime: python
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: CORS_ORIGINS
        value: "*"
      # sync: false pauses the blueprint to prompt you for the DB string in the UI
      - key: DATABASE_URL
        sync: false

  # --- 2. WebSocket Relay (Node.js) ------------------------
  - type: web
    name: cryptolens-ws
    runtime: node
    region: singapore
    rootDir: ws-server
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"

  # --- 3. React Frontend (Static) --------------------------
  - type: web
    name: cryptolens-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE
        fromService:
          type: web
          name: cryptolens-api
          property: host
      - key: VITE_WS_URL
        fromService:
          type: web
          name: cryptolens-ws
          property: host