# Render Blueprint — deploys the backend API, WebSocket relay, and Frontend.
# Create all services at once: Render Dashboard → New → Blueprint → pick this repo.
services:
  # --- FastAPI REST API + PostgreSQL (Logic Layer) -------------------------
  - type: web
    name: cryptolens-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: cryptolens-frontend
          property: url
      # MUST SET DATABASE_URL IN RENDER DASHBOARD MANUALLY 
      # TO POINT TO YOUR PROVISIONED POSTGRESQL INSTANCE

  # --- Node WebSocket relay for the live order book ------------------------
  - type: web
    name: cryptolens-ws
    runtime: node
    plan: free
    region: singapore
    rootDir: ws-server
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"

  # --- React/Vite Frontend Static Site -------------------------------------
  - type: web
    name: cryptolens-frontend
    runtime: static
    plan: free
    region: singapore
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE
        fromService:
          type: web
          name: cryptolens-api
          property: url
      - key: VITE_WS_URL
        fromService:
          type: web
          name: cryptolens-ws
          property: url